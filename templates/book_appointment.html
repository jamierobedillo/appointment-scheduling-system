
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #F5F7FA;
            color: #243B53;
        }

        nav {
            background: #243B53;
            color: white;
            padding: 20px 8%;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #718096;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #CBD5E0;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 22px;
            background: #2A9D8F;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: #238579;
        }

        .back {
            background: #718096;
            margin-left: 8px;
        }

        .message {
            color: #C53030;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <nav>
        <h2>Appointment System</h2>
    </nav>

    <div class="container">

        <h1>Book an Appointment</h1>
        <p>Fill out the form below to schedule your appointment.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('book_appointment') }}">

            <label for="service_id">Select Service</label>
            <select name="service_id" id="service_id" required>
                <option value="">Choose a service</option>

                {% for item in services %}
                    <option value="{{ item.service_id }}">
                        {{ item.service.service_name }}
                        - ₱{{ "%.2f"|format(item.service.price) }}
                        ({{ item.service.duration }} minutes)
                    </option>
                {% endfor %}

            </select>

            <label for="appointment_date">Appointment Date</label>
            <input
                type="date"
                name="appointment_date"
                id="appointment_date"
                required
            >

            <label for="start_time">Appointment Time</label>
            <input
                type="time"
                name="start_time"
                id="start_time"
                required
            >

            <label for="notes">Additional Notes</label>
            <textarea
                name="notes"
                id="notes"
                rows="4"
                placeholder="Enter additional information (optional)"
            ></textarea>

            <button type="submit" class="btn">
                Book Appointment
            </button>

            <a href="{{ url_for('customer_dashboard') }}" class="btn back">
                Back
            </a>

        </form>

    </div>

</body>
</html>
