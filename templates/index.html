
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Scheduling System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #F5F7FA;
            color: #243B53;
        }

        nav {
            background: #243B53;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 22px;
        }

        .container {
            max-width: 900px;
            margin: 70px auto;
            padding: 40px;
            text-align: center;
        }

        .container h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .container p {
            color: #718096;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #2A9D8F;
            color: white;
            padding: 13px 25px;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #238579;
        }
    </style>
</head>

<body>

    <nav>
        <h2>Appointment System</h2>
        <span>Python Flask Version</span>
    </nav>

    <div class="container">
        <h1>Appointment Scheduling System</h1>

        <p>
            Simple, convenient, and easy appointment booking.
        </p>

        <a href="/test" class="btn">
            Test Flask Application
        </a>
    </div>

</body>
</html>
